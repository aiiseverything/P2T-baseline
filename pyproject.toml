[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpo-rm"
version = "0.1.0"
description = "Frozen reward-model gradients for GRPO token credit assignment"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
hf = ["transformers>=4.51,<6"]
data = ["datasets>=3.0", "pyarrow>=15"]
train = [
  "transformers>=4.51,<6",
  "datasets>=3.0",
  "pyarrow>=15",
  "peft>=0.14",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "pillow>=10",
  "jinja2>=3.1",
]
test = [
  "pytest>=8",
  "transformers>=4.51,<6",
  "langdetect==1.0.9",
  "immutabledict>=4",
  "nltk>=3.9",
  "absl-py>=2",
  "pandas>=2",
  "httpx>=0.28,<1",
  "peft>=0.14",
]

[tool.setuptools.packages.find]
include = ["vpo_rm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
